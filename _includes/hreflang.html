{%- comment -%}
  Points crawlers at the homepage of every language. Same MVP caveat as
  lang-switcher.html — not per-page yet.
{%- endcomment -%}
{%- for lang in site.languages -%}
<link rel="alternate" hreflang="{{ lang }}" href="{% if lang == site.default_lang %}{{ site.url }}{{ "/" | relative_url }}{% else %}{{ site.url }}{{ "/" | append: lang | append: "/" | relative_url }}{% endif %}">
{%- endfor -%}
